<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบแจ้งลางาน / จองวันลาตามชื่อ - ส.ดพ.บางบอน</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Sarabun', sans-serif;
        }
    </style>
</head>
<body class="bg-zinc-950 text-white min-h-screen flex flex-col items-center justify-center p-4">

    <!-- Container หลัก -->
    <div class="w-full max-w-xl bg-zinc-900 border border-zinc-800 rounded-2xl p-6 shadow-2xl">
        
        <!-- Header -->
        <div class="flex items-center space-x-3 mb-6 pb-4 border-b border-zinc-800">
            <div class="p-3 bg-amber-500/10 rounded-xl text-amber-500">
                <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
                </svg>
            </div>
            <div>
                <h1 class="text-xl font-bold text-zinc-100">ระบบแจ้งลางาน / จองวันลาตามชื่อ</h1>
                <p class="text-sm text-zinc-400">สถานีดับเพลิงและกู้ภัยบางบอน</p>
            </div>
        </div>

        <!-- ฟอร์มกรอกข้อมูลการลา -->
        <form id="leaveForm" class="space-y-4">
            
            <!-- เลือกชื่อเจ้าหน้าที่ -->
            <div>
                <label class="block text-sm font-medium text-zinc-300 mb-1.5">ชื่อเจ้าหน้าที่</label>
                <select id="staffName" required class="w-full bg-zinc-800 border border-zinc-700 rounded-xl px-4 py-2.5 text-white focus:outline-none focus:border-amber-500 transition">
                    <option value="">-- กรุณาเลือกรายชื่อเจ้าหน้าที่ --</option>
                    <option value="นายจตุพล พันธุ์ดี">นายจตุพล พันธุ์ดี</option>
                    <option value="นายพงศกร พิมพกรณ์">นายพงศกร พิมพกรณ์</option>
                    <option value="นายมงคล มุธระพัฒน์">นายมงคล มุธระพัฒน์</option>
                    <option value="ส.ท.อธิพัฒน์ พวงทอง">ส.ท.อธิพัฒน์ พวงทอง</option>
                    <option value="นายชัยวุฒิ ขวัญเมือง">นายชัยวุฒิ ขวัญเมือง</option>
                    <option value="นายสว่าง หวังสุข">นายสว่าง หวังสุข</option>
                    <option value="นายพีรวิชญ์ ขุนสร้าง">นายพีรวิชญ์ ขุนสร้าง</option>
                </select>
            </div>

            <!-- ประเภทการลา -->
            <div>
                <label class="block text-sm font-medium text-zinc-300 mb-1.5">ประเภทการลา</label>
                <select id="leaveType" required class="w-full bg-zinc-800 border border-zinc-700 rounded-xl px-4 py-2.5 text-white focus:outline-none focus:border-amber-500 transition">
                    <option value="ลากิจ">ลากิจ</option>
                    <option value="ลาป่วย">ลาป่วย</option>
                    <option value="ลาพักร้อน">ลาพักร้อน</option>
                    <option value="ลาอื่นๆ">ลาอื่นๆ</option>
                </select>
            </div>

            <!-- วันที่เริ่มต้น - สิ้นสุด -->
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium text-zinc-300 mb-1.5">ตั้งแต่วันที่</label>
                    <input type="date" id="startDate" required class="w-full bg-zinc-800 border border-zinc-700 rounded-xl px-4 py-2.5 text-white focus:outline-none focus:border-amber-500 transition">
                </div>
                <div>
                    <label class="block text-sm font-medium text-zinc-300 mb-1.5">ถึงวันที่</label>
                    <input type="date" id="endDate" required class="w-full bg-zinc-800 border border-zinc-700 rounded-xl px-4 py-2.5 text-white focus:outline-none focus:border-amber-500 transition">
                </div>
            </div>

            <!-- หมายเหตุเพิ่มเติม -->
            <div>
                <label class="block text-sm font-medium text-zinc-300 mb-1.5">เหตุผล / หมายเหตุ (ถ้ามี)</label>
                <textarea id="leaveReason" rows="2" placeholder="ระบุเหตุผลการลา..." class="w-full bg-zinc-800 border border-zinc-700 rounded-xl px-4 py-2.5 text-white focus:outline-none focus:border-amber-500 transition resize-none"></textarea>
            </div>

            <!-- ปุ่มกดส่งข้อมูล -->
            <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-semibold py-3 rounded-xl transition duration-200 flex items-center justify-center space-x-2 shadow-lg shadow-emerald-900/20">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
                </svg>
                <span>ยืนยันการแจ้งลา / จองวันลา</span>
            </button>
        </form>

        <!-- ส่วนแสดงประวัติการลาล่าสุดในเครื่อง (LocalStorage) -->
        <div class="mt-8 pt-6 border-t border-zinc-800">
            <h2 class="text-sm font-semibold text-zinc-400 mb-3 flex items-center justify-between">
                <span>รายการจองลาล่าสุด</span>
                <span id="recordCount" class="text-xs bg-zinc-800 text-zinc-300 px-2 py-0.5 rounded-full">0 รายการ</span>
            </h2>
            <div id="leaveHistoryList" class="space-y-2.5 max-h-48 overflow-y-auto pr-1">
                <p class="text-xs text-zinc-500 text-center py-4">ยังไม่มีประวัติการบันทึกในระบบนี้</p>
            </div>
        </div>

    </div>

    <!-- Script สำหรับควบคุมการทำงาน -->
    <script>
        // โหลดข้อมูลเดิมขึ้นมาแสดงผลเมื่อเปิดหน้าเว็บ
        document.addEventListener('DOMContentLoaded', renderHistory);

        document.getElementById('leaveForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const staffName = document.getElementById('staffName').value;
            const leaveType = document.getElementById('leaveType').value;
            const startDate = document.getElementById('startDate').value;
            const endDate = document.getElementById('endDate').value;
            const leaveReason = document.getElementById('leaveReason').value || '-';

            // ตรวจสอบความถูกต้องของวันที่
            if (startDate > endDate) {
                alert('⚠️ วันที่เริ่มต้นต้องไม่มากกว่าวันที่สิ้นสุด');
                return;
            }

            const newRecord = {
                id: Date.now(),
                staffName,
                leaveType,
                startDate,
                endDate,
                leaveReason,
                timestamp: new Date().toLocaleString('th-TH')
            };

            // ดึงข้อมูลเก่าจาก LocalStorage
            let records = JSON.parse(localStorage.getItem('bangbon_leaves')) || [];
            records.unshift(newRecord); // เอาไว้บนสุด
            localStorage.setItem('bangbon_leaves', JSON.stringify(records));

            alert(`✅ บันทึกการลาของ "${staffName}" สำเร็จเรียบร้อย`);
            
            // รีเซ็ตฟอร์มและอัปเดตตารางประวัติ
            document.getElementById('leaveForm').reset();
            renderHistory();
        });

        function renderHistory() {
            const container = document.getElementById('leaveHistoryList');
            const countBadge = document.getElementById('recordCount');
            let records = JSON.parse(localStorage.getItem('bangbon_leaves')) || [];

            countBadge.innerText = `${records.length} รายการ`;

            if (records.length === 0) {
                container.innerHTML = `<p class="text-xs text-zinc-500 text-center py-4">ยังไม่มีประวัติการบันทึกในระบบนี้</p>`;
                return;
            }

            container.innerHTML = '';
            records.forEach(rec => {
                const item = document.createElement('div');
                item.className = "bg-zinc-800/60 border border-zinc-700/50 rounded-xl p-3 text-xs flex flex-col space-y-1";
                item.innerHTML = `
                    <div class="flex justify-between items-center">
                        <span class="font-semibold text-amber-400 text-sm">${rec.staffName}</span>
                        <span class="bg-amber-500/10 text-amber-300 px-2 py-0.5 rounded text-[10px] font-medium">${rec.leaveType}</span>
                    </div>
                    <div class="text-zinc-300">
                        🕒 ช่วงเวลา: <span class="text-white">${rec.startDate}</span> ถึง <span class="text-white">${rec.endDate}</span>
                    </div>
                    <div class="text-zinc-400 italic">หมายเหตุ: ${rec.leaveReason}</div>
                `;
                container.appendChild(item);
            });
        }
    </script>
</body>
</html>
