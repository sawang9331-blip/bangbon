<div id="tab-fire" class="tab-content">
    <div class="glass p-6 rounded-3xl mb-6 bg-zinc-900 border border-red-900/30">
        <h2 class="text-xl font-bold text-white mb-4 flex items-center gap-2">
            <i class="fa-solid fa-fire text-red-500"></i> รายงานเหตุเพลิงไหม้
        </h2>
        <div class="space-y-4">
            <div>
                <label class="text-xs text-zinc-400">สถานที่เกิดเหตุ</label>
                <input type="text" id="fire_place" placeholder="ระบุสถานที่..." class="w-full bg-black/40 border border-zinc-700 rounded-xl p-3 focus:border-red-500 transition">
            </div>
            <button onclick="prepareReport('fire')" class="w-full bg-red-600 hover:bg-red-700 p-4 rounded-2xl font-bold text-white shadow-lg shadow-red-900/20 transition-all active:scale-95">
                <i class="fa-solid fa-paper-plane mr-2"></i> บันทึกและส่งรายงาน
            </button>
        </div>
    </div>
</div>

<div id="tab-rescue" class="tab-content">
    <div class="glass p-6 rounded-3xl mb-6 bg-zinc-900 border border-yellow-900/30">
        <h2 class="text-lg font-bold text-white mb-4 flex items-center gap-2">
            <i class="fa-solid fa-handshake-angle text-yellow-500"></i> ช่วยเหลือประชาชน / 501
        </h2>
        <div class="space-y-4">
            <div>
                <label class="text-xs text-zinc-400">ประเภทสัตว์ / เหตุ</label>
                <select id="res_type_text" class="w-full bg-black/40 border border-zinc-700 rounded-xl p-3">
                    <option value="งูเหลือม">งูเหลือม</option>
                    <option value="งูเห่า">งูเห่า</option>
                    <option value="ตัวเงินตัวทอง">ตัวเงินตัวทอง</option>
                </select>
            </div>
            <button onclick="prepareReport('rescue')" class="w-full bg-yellow-600 hover:bg-yellow-700 p-4 rounded-2xl font-bold text-black shadow-lg shadow-yellow-900/20 transition-all active:scale-95">
                <i class="fa-solid fa-paper-plane mr-2"></i> บันทึกและส่งรายงาน
            </button>
        </div>
    </div>
</div>
