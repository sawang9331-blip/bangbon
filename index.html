<!DOCTYPE html>

<head>
    <meta charset="UTF-8">

    <title>ส.ดพ.บางบอน V3.1.6</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background-color: #121212; color: #e0e0e0; margin: 0; padding-bottom: 80px; min-height: 100vh; -webkit-user-select: none; user-select: none; }
        .app-header { background: #b71c1c; position: sticky; top: 0; z-index: 50; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        .tab-content { display: none; padding: 16px; max-width: 500px; margin: auto; }
        .tab-content.active { display: block !important; animation: fadeIn 0.2s ease-out; }
        input, select { width: 100%; padding: 12px; margin-top: 5px; background-color: #2a2a2a; border: 1px solid #444; border-radius: 8px; color: #fff; box-sizing: border-box; font-size: 16px; transition: 0.2s; }
        input:focus, select:focus { border-color: #b71c1c; outline: none; background-color: #333; }
        .live-review-box { margin-top: 8px; padding: 10px; background: #071408; border-left: 3px solid #00ff41; font-family: monospace; font-size: 0.85em; color: #00ff41; border-radius: 4px; }
        .staff-selector { background: #1a1a1a; border-radius: 8px; padding: 12px; margin-top: 5px; max-height: 200px; overflow-y: auto; border: 1px solid #333; }
        .staff-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .staff-item { display: flex; align-items: center; gap: 8px; font-size: 0.85em; cursor: pointer; background: #262626; padding: 8px; border-radius: 6px; border: 1px solid #333; }
        .staff-item input { width: auto; margin-top: 0; transform: scale(1.2); }
        .group-title { font-size: 0.8em; color: #ffd740; margin: 12px 0 6px 0; border-bottom: 1px dashed #333; padding-bottom: 2px; font-weight: bold; }
        .nav-bar { position: fixed; bottom: 0; left: 0; right: 0; background: #1e1e1e; height: 65px; display: flex; border-top: 1px solid #333; z-index: 9999; }
        .nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #888; font-size: 0.75em; cursor: pointer; transition: 0.2s; -webkit-tap-highlight-color: transparent; }
        .nav-item.active { color: #ff5252; }
        .nav-item i { font-size: 1.4em; margin-bottom: 3px; }
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: none; justify-content: center; align-items: center; z-index: 10000; padding: 16px; }
        .modal-container { background: #1e1e1e; padding: 20px; border-radius: 16px; width: 100%; max-width: 450px; border: 1px solid #444; max-height: 85vh; display: flex; flex-direction: column; }
        .modal-body { overflow-y: auto; flex-grow: 1; margin: 15px 0; background: #000; color: #00ff41; padding: 15px; border-radius: 8px; font-family: 'Courier New', monospace; white-space: pre-wrap; font-size: 0.95em; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>

</div>
