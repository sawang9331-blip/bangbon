<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ส.ดพ.บางบอน V3.2.0 (Modern Edition)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Kanit', sans-serif; background: radial-gradient(circle at top, #1a0f0f, #050505); color: #e0e0e0; margin: 0; padding-bottom: 80px; min-height: 100vh; }
        .glass { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(15px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .app-header { background: rgba(183, 28, 28, 0.8); backdrop-filter: blur(10px); position: sticky; top: 0; z-index: 50; }
        .tab-content { display: none; padding: 20px; max-width: 500px; margin: auto; }
        .tab-content.active { display: block !important; animation: fadeIn 0.3s ease-out; }
        input, select { width: 100%; padding: 12px; margin-top: 5px; background: rgba(0, 0, 0, 0.3); border: 1px solid #444; border-radius: 12px; color: #fff; }
        .nav-bar { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(20, 20, 20, 0.95); backdrop-filter: blur(20px); height: 70px; display: flex; border-top: 1px solid rgba(255,255,255,0.1); z-index: 9999; }
        .nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #888; font-size: 0.75em; transition: 0.3s; }
        .nav-item.active { color: #ff5252; }
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: none; justify-content: center; align-items: center; z-index: 10000; padding: 16px; }
        .modal-container { background: #1e1e1e; padding: 20px; border-radius: 16px; width: 100%; max-width: 450px; }
        .modal-body { background: #000; color: #00ff41; padding: 15px; border-radius: 8px; font-family: monospace; white-space: pre-wrap; margin: 15px 0; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

<div class="app-header p-4 flex items-center justify-between text-white shadow-lg">
    <div class="flex items-center gap-3">
        <span class="text-2xl">🔥</span>
        <div><h1 class="font-bold text-lg">ส.ดพ.บางบอน</h1><p class="text-[10px] opacity-70">ระบบบันทึกรายงาน V3.2.0</p></div>
    </div>
    <div id="current-date" class="text-[10px] bg-black/30 px-3 py-1 rounded-full border border-white/10">กำลังโหลด...</div>
</div>

<div id="tab-home" class="tab-content active">
    <div class="glass p-6 rounded-3xl mb-6 text-center border border-white/5">
        <h2 class="text-2xl font-bold text-white mb-2">ยินดีต้อนรับ</h2>
        <p class="text-sm text-zinc-400">เลือกประเภทรายการเพื่อเริ่มบันทึกเหตุ</p>
    </div>
    <div class="space-y-4">
        <button onclick="switchTab('fire')" class="glass w-full p-5 rounded-2xl text-left flex items-center gap-4 transition-all hover:bg-white/5">
            <div class="w-12 h-12 rounded-2xl bg-red-500/20 flex items-center justify-center text-red-500 text-xl"><i class="fa-solid fa-fire"></i></div>
            <div><h3 class="font-bold text-white">รายงานเหตุเพลิงไหม้</h3><p class="text-xs opacity-60">สำหรับเหตุเพลิงไหม้อาคารและที่โล่ง</p></div>
        </button>
        <button onclick="switchTab('rescue')" class="glass w-full p-5 rounded-2xl text-left flex items-center gap-4 transition-all hover:bg-white/5">
            <div class="w-12 h-12 rounded-2xl bg-amber-500/20 flex items-center justify-center text-amber-500 text-xl"><i class="fa-solid fa-snake"></i></div>
            <div><h3 class="font-bold text-white">ช่วยเหลือประชาชน</h3><p class="text-xs opacity-60">สำหรับเหตุสัตว์เลื้อยคลานและภัยทั่วไป</p></div>
        </button>
    </div>
</div>

<div id="tab-fire" class="tab-content"><h2 class="text-lg font-bold text-white mb-4">บันทึกเหตุเพลิงไหม้</h2></div>
<div id="tab-rescue" class="tab-content"><h2 class="text-lg font-bold text-white mb-4">ช่วยเหลือประชาชน</h2></div>

<div class="nav-bar">
    <div onclick="switchTab('home')" class="nav-item active"><i class="fa-solid fa-house"></i><span>หน้าแรก</span></div>
    <div onclick="switchTab('fire')" class="nav-item"><i class="fa-solid fa-fire"></i><span>เพลิงไหม้</span></div>
    <div onclick="switchTab('rescue')" class="nav-item"><i class="fa-solid fa-handshake-angle"></i><span>ช่วยเหลือ</span></div>
</div>

<script>
    const SB_URL = "https://ifnmqrlrtqexmthmfsgb.supabase.co/rest/v1/incident_reports";
    const SB_KEY = "sb_publishable_zEP8YY74Ygvhji-giNBcsA_gRv3kjJ4";

    function switchTab(tabId) {
        document.querySelectorAll('.tab-content').forEach(el => el.style.display = 'none');
        document.getElementById('tab-' + tabId).style.display = 'block';
    }

    function getThaiDate() {
        const d = new Date();
        const m = ["มกราคม", "กุมภาพันธ์", "มีนาคม", "เมษายน", "พฤษภาคม", "มิถุนายน", "กรกฎาคม", "สิงหาคม", "กันยายน", "ตุลาคม", "พฤศจิกายน", "ธันวาคม"];
        return "วันที่ " + d.getDate() + " " + m[d.getMonth()] + " " + (d.getFullYear() + 543);
    }

    window.onload = () => {
        document.getElementById('current-date').innerText = getThaiDate();
    };
    // ... [คงฟังก์ชัน prepareReport, sendFinal อื่นๆ ของพี่ไว้ตรงนี้ต่อได้เลยครับ] ...
</script>
</body>
</html>
