<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ส.ดพ.บางบอน | ระบบรายงาน V3.2.1</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Kanit', sans-serif; background: #050505; color: #fff; padding-bottom: 90px; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .nav-bar { position: fixed; bottom: 0; width: 100%; background: #1a1a1a; display: flex; border-top: 1px solid #333; z-index: 100; }
        .nav-item { flex: 1; padding: 15px; text-align: center; color: #666; cursor: pointer; }
        .nav-item.active { color: #ff5252; }
    </style>
</head>
<body>

<div class="bg-red-900 p-4 text-center font-bold shadow-lg">ส.ดพ.บางบอน V3.2.1</div>

<div id="tab-home" class="tab-content active p-4">
    <div class="bg-zinc-800 p-6 rounded-xl mb-4 border border-zinc-700 text-center">
        <h2 class="text-xl font-bold">เลือกประเภทงาน</h2>
    </div>
    <button onclick="switchTab('fire')" class="w-full bg-zinc-800 p-6 mb-4 rounded-xl border border-red-900 text-left">รายงานเหตุเพลิงไหม้</button>
    <button onclick="switchTab('rescue')" class="w-full bg-zinc-800 p-6 rounded-xl border border-yellow-900 text-left">ช่วยเหลือประชาชน</button>
</div>

<div id="tab-fire" class="tab-content p-4">
    <h2 class="text-xl font-bold mb-4">รายงานเหตุเพลิงไหม้</h2>
    <input type="text" id="fire_place" placeholder="สถานที่เกิดเหตุ" class="w-full p-3 bg-zinc-900 border border-zinc-700 rounded-xl mb-4">
    <button onclick="saveReport('fire')" class="w-full bg-red-600 p-4 rounded-xl font-bold">บันทึกรายงาน</button>
</div>

<div id="tab-rescue" class="tab-content p-4">
    <h2 class="text-xl font-bold mb-4">ช่วยเหลือประชาชน</h2>
    <input type="text" id="res_place" placeholder="สถานที่เกิดเหตุ" class="w-full p-3 bg-zinc-900 border border-zinc-700 rounded-xl mb-4">
    <button onclick="saveReport('rescue')" class="w-full bg-amber-600 p-4 rounded-xl font-bold">บันทึกรายงาน</button>
</div>

<div class="nav-bar">
    <div class="nav-item active" onclick="switchTab('home')"><i class="fa-solid fa-house"></i></div>
    <div class="nav-item" onclick="switchTab('fire')"><i class="fa-solid fa-fire"></i></div>
    <div class="nav-item" onclick="switchTab('rescue')"><i class="fa-solid fa-handshake"></i></div>
</div>

<script>
    // 1. ฟังก์ชันสลับหน้า (ที่พี่เคยใช้)
    function switchTab(tabId) {
        document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
        document.getElementById('tab-' + tabId).classList.add('active');
        const navMap = { 'home': 0, 'fire': 1, 'rescue': 2 };
        document.querySelectorAll('.nav-item')[navMap[tabId]].classList.add('active');
    }

    // 2. ระบบบันทึก (เชื่อม Supabase ที่พี่มีอยู่)
    const SB_URL = "https://ifnmqrlrtqexmthmfsgb.supabase.co/rest/v1/incident_reports";
    const SB_KEY = "sb_publishable_zEP8YY74Ygvhji-giNBcsA_gRv3kjJ4";

    async function saveReport(type) {
        let place = (type === 'fire') ? document.getElementById('fire_place').value : document.getElementById('res_place').value;
        if(!place) { alert('กรุณาระบุสถานที่'); return; }
        
        const data = { type: type, place: place, date: new Date().toISOString() };
        
        try {
            const res = await fetch(SB_URL, {
                method: 'POST',
                headers: { 
                    'apikey': SB_KEY, 
                    'Authorization': 'Bearer ' + SB_KEY, 
                    'Content-Type': 'application/json',
                    'Prefer': 'return=minimal' 
                },
                body: JSON.stringify(data)
            });
            if(res.ok) alert('บันทึกสำเร็จ!');
            else alert('เกิดข้อผิดพลาดในการบันทึก');
        } catch(e) { 
            alert('เชื่อมต่อฐานข้อมูลไม่ได้'); 
        }
    }
</script>
</body>
</html>
