<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ส.ดพ.บางบอน | ระบบรายงาน</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background: #050505; color: #fff; font-family: sans-serif; padding-bottom: 90px; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .nav-bar { position: fixed; bottom: 0; width: 100%; background: #1a1a1a; display: flex; border-top: 1px solid #333; z-index: 100; }
        .nav-item { flex: 1; padding: 15px; text-align: center; color: #666; cursor: pointer; }
        .nav-item.active { color: #ff5252; }
    </style>
</head>
<body>

<div class="bg-red-900 p-4 shadow-lg text-center font-bold">ส.ดพ.บางบอน V3.2.1</div>

<div id="tab-home" class="tab-content active p-4">
    <h2 class="text-xl mb-4">เลือกประเภทงาน</h2>
    <button onclick="switchTab('fire')" class="w-full bg-zinc-800 p-6 mb-4 rounded-xl border border-red-900 text-left">รายงานเพลิงไหม้</button>
    <button onclick="switchTab('rescue')" class="w-full bg-zinc-800 p-6 rounded-xl border border-yellow-900 text-left">ช่วยเหลือประชาชน</button>
</div>

<div id="tab-fire" class="tab-content p-4">
    <h2 class="text-xl mb-4">รายงานเหตุเพลิงไหม้</h2>
    <input type="text" id="fire_place" placeholder="สถานที่เกิดเหตุ" class="w-full p-3 bg-zinc-900 rounded mb-4">
    <button onclick="alert('ระบบพร้อมใช้งาน')" class="w-full bg-red-600 p-4 rounded-xl font-bold">บันทึกรายงาน</button>
</div>

<div id="tab-rescue" class="tab-content p-4">
    <h2 class="text-xl mb-4">ช่วยเหลือประชาชน</h2>
    <input type="text" id="res_place" placeholder="สถานที่เกิดเหตุ" class="w-full p-3 bg-zinc-900 rounded mb-4">
    <button onclick="alert('ระบบพร้อมใช้งาน')" class="w-full bg-amber-600 p-4 rounded-xl font-bold">บันทึกรายงาน</button>
</div>

<div class="nav-bar">
    <div class="nav-item active" onclick="switchTab('home')"><i class="fa-solid fa-house"></i></div>
    <div class="nav-item" onclick="switchTab('fire')"><i class="fa-solid fa-fire"></i></div>
    <div class="nav-item" onclick="switchTab('rescue')"><i class="fa-solid fa-handshake"></i></div>
</div>

<script>
    function switchTab(tabId) {
        // 1. ซ่อนทุกหน้า
        document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
        
        // 2. แสดงหน้าที่เลือก
        document.getElementById('tab-' + tabId).classList.add('active');
        
        // 3. ไฮไลท์ปุ่มเมนู (ถ้ากดจากปุ่มในหน้าจอหลักจะยังไม่มี Nav active)
        const navMap = { 'home': 0, 'fire': 1, 'rescue': 2 };
        document.querySelectorAll('.nav-item')[navMap[tabId]].classList.add('active');
    }
</script>
</body>
</html>
