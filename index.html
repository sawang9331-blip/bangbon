<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ส.ดพ.บางบอน V3.3.2</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-icons/4.7.0/css/font-awesome.min.css">
    <style>
        body { font-family: 'ChulaCharas', 'Sarabun', sans-serif; background-color: #09090b; color: #f4f4f5; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
    </style>
</head>
<body class="bg-zinc-950 text-zinc-50 min-h-screen pb-20">

    <header class="bg-zinc-900 border-b border-zinc-800 p-4 sticky top-0 z-50 shadow-md">
        <div class="max-w-md mx-auto flex justify-between items-center">
            <div>
                <h1 class="text-lg font-bold text-amber-500 flex items-center gap-2">
                    🚒 ส.ดพ.บางบอน <span class="text-xs bg-zinc-800 text-zinc-400 px-1.5 py-0.5 rounded border border-zinc-700">V3.3.2</span>
                </h1>
                <p class="text-[11px] text-zinc-400" id="current-date">กำลังโหลดวันที่...</p>
            </div>
            <div class="text-right">
                <span class="text-xs bg-amber-950/40 text-amber-400 border border-amber-500/30 px-2 py-1 rounded-full font-medium shadow-sm shadow-amber-950">ชุดที่ 2</span>
            </div>
        </div>
    </header>

    <main class="max-w-md mx-auto p-4 space-y-4">
        
        <div id="tab-home" class="tab-content active space-y-4">
            <div class="bg-zinc-900 border border-zinc-800 rounded-xl p-4 shadow-xl relative overflow-hidden">
                <div class="absolute top-0 left-0 w-1 h-full bg-amber-500"></div>
                <h2 class="text-sm font-semibold text-zinc-400 mb-3 flex items-center gap-2">📅 เจ้าหน้าที่ปฏิบัติหน้าที่วันนี้</h2>
                <div id="today-duty-box" class="space-y-2.5">
                    <div class="text-center text-zinc-500 py-4 text-xs">กำลังเชื่อมต่อฐานข้อมูล Google ชีต...</div>
                </div>
            </div>
        </div>

        <div id="tab-search" class="tab-content space-y-4">
            <div class="bg-zinc-900 border border-zinc-800 rounded-xl p-4 shadow-xl">
                <h2 class="text-sm font-semibold text-zinc-400 mb-3">🔍 ค้นหาตารางเวรล่วงหน้า</h2>
                <div class="space-y-3">
                    <div>
                        <label class="block text-xs text-zinc-500 mb-1">เลือกเดือนที่ต้องการดู</label>
                        <select id="search-month-select" class="w-full bg-zinc-950 border border-zinc-800 rounded-lg p-2.5 text-sm text-zinc-200 focus:outline-none focus:border-amber-500" onchange="searchIndividualDuty()">
                            <option value="">-- เลือกเดือน --</option>
                            <option value="มกราคม">มกราคม</option>
                            <option value="กุมภาพันธ์">กุมภาพันธ์</option>
                            <option value="มีนาคม">มีนาคม</option>
                            <option value="เมษายน">เมษายน</option>
                            <option value="พฤษภาคม">พฤษภาคม</option>
                            <option value="มิถุนายน" selected>มิถุนายน</option>
                            <option value="กรกฎาคม">กรกฎาคม</option>
                            <option value="สิงหาคม">สิงหาคม</option>
                            <option value="กันยายน">กันยายน</option>
                            <option value="ตุลาคม">ตุลาคม</option>
                            <option value="พฤศจิกายน">พฤศจิกายน</option>
                            <option value="ธันวาคม">ธันวาคม</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs text-zinc-500 mb-1">เลือกรหัสเจ้าหน้าที่</label>
                        <select id="search-staff-id" class="w-full bg-zinc-950 border border-zinc-800 rounded-lg p-2.5 text-sm text-zinc-200 focus:outline-none focus:border-amber-500" onchange="searchIndividualDuty()">
                            <option value="">-- เลือกรหัสบุคคล --</option>
                        </select>
                    </div>
                </div>
            </div>

            <div id="individual-result" class="bg-zinc-900 border border-zinc-800 rounded-xl p-4 shadow-xl hidden">
                <h3 class="text-xs font-semibold text-amber-500 mb-2 border-b border-zinc-800 pb-1" id="ind-summary">ผลการตรวจสอบ</h3>
                <div id="ind-details-list" class="space-y-1 max-h-60 overflow-y-auto">
                    </div>
            </div>
        </div>
    </main>

    <nav class="fixed bottom-0 left-0 right-0 bg-zinc-900/95 border-t border-zinc-800 p-2 backdrop-blur-md z-50">
        <div class="max-w-md mx-auto flex justify-around">
            <button onclick="switchTab('home')" class="flex flex-col items-center gap-1 text-zinc-400 hover:text-amber-500 p-2">
                <span class="text-lg">🏠</span><span class="text-[10px]">เวรวันนี้</span>
            </button>
            <button onclick="switchTab('search')" class="flex flex-col items-center gap-1 text-zinc-400 hover:text-amber-500 p-2">
                <span class="text-lg">🔍</span><span class="text-[10px]">ค้นหาล่วงหน้า</span>
            </button>
        </div>
    </nav>

    <script>
        let globalAllSheetsData = {};
        const CONFIG = {
            API_URL: "https://script.google.com/macros/s/AKfycbwP7fGv9p0OidGfCgX7Dq8VjD8l2vU9uQyXnSg_wFEx-q6G6-S66hR7-qK6b7N_7g99/exec"
        };

        window.addEventListener("load", function() {
            document.getElementById('current-date').innerText = getThaiDate();
            initStaffDropdown();
            fetchData();
        });

        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.getElementById('tab-' + tabId).classList.add('active');
        }

        function getThaiDate() {
            const d = new Date();
            const months = ["ม.ค.", "ก.พ.", "มี.ค.", "เม.ย.", "พ.ค.", "มิ.ย.", "ก.ค.", "ส.ค.", "ก.ย.", "ต.ค.", "พ.ย.", "ธ.ค."];
            return `วันเสาร์ที่ ${d.getDate()} ${months[d.getMonth()]} ${d.getFullYear() + 543}`;
        }

        function initStaffDropdown() {
            const select = document.getElementById('search-staff-id');
            if(!select) return;
            // เพิ่มรหัสเจ้าหน้าที่พื้นฐาน (สามารถเพิ่มลดได้ตามต้องการครับ)
            const staffList = ["2-1", "2-2", "2-3", "2-4", "2-5", "2-6", "2-7", "2-8", "2-9", "2-10"];
            staffList.forEach(id => {
                let opt = document.createElement('option');
                opt.value = id;
                opt.innerText = `บางบอน ${id}`;
                select.appendChild(opt);
            });
        }

        function fetchData() {
            fetch(CONFIG.API_URL)
                .then(res => res.json())
                .then(data => {
                    if (data.allSheetsData) {
                        globalAllSheetsData = data.allSheetsData;
                    }
                    
                    // แสดงเวรวันนี้หน้าแรก
                    const box = document.getElementById('today-duty-box');
                    box.innerHTML = `
                        <div class="flex justify-between border-b border-zinc-800 py-1.5 text-xs">
                            <span class="text-zinc-400">ชุดปฏิบัติการ:</span> <span class="text-zinc-200 font-bold">${data.dutySet || '-'}</span>
                        </div>
                        <div class="flex justify-between border-b border-zinc-800 py-1.5 text-xs">
                            <span class="text-zinc-400">พนักงานวิทยุ:</span> <span class="text-amber-400 font-semibold">${data.radioOp || '-'}</span>
                        </div>
                        <div class="flex justify-between border-b border-zinc-800 py-1.5 text-xs">
                            <span class="text-zinc-400">เสมียนเวร:</span> <span class="text-zinc-200">${data.clerk || '-'}</span>
                        </div>
                        <div class="flex justify-between border-b border-zinc-800 py-1.5 text-xs">
                            <span class="text-zinc-400">รักษาสถานที่:</span> <span class="text-zinc-200">${data.guard || '-'}</span>
                        </div>
                        <div class="flex justify-between border-b border-zinc-800 py-1.5 text-xs">
                            <span class="text-zinc-400">ตำแหน่ง 501:</span> <span class="text-zinc-200">${data.pos501 || '-'}</span>
                        </div>
                        <div class="text-center mt-2 text-[10px] text-zinc-500">⏱️ เวลาปฏิบัติหน้าที่: ${data.timeStr || '-'}</div>
                    `;
                })
                .catch(err => {
                    document.getElementById('today-duty-box').innerHTML = `<div class="text-center text-red-400 py-2 text-xs">⚠️ เชื่อมต่อฐานข้อมูลไม่สำเร็จ</div>`;
                });
        }

        function searchIndividualDuty() {
            const monthEl = document.getElementById('search-month-select');
            const staffEl = document.getElementById('search-staff-id');
            const resultBox = document.getElementById('individual-result');
            const summaryEl = document.getElementById('ind-summary');
            const listEl = document.getElementById('ind-details-list');
            
            if (!monthEl || !staffEl || !staffEl.value) {
                if (resultBox) resultBox.classList.add('hidden');
                return;
            }

            const selectedMonth = monthEl.value;
            const targetId = staffEl.value;
            
            let targetSheetName = Object.keys(globalAllSheetsData).find(name => name.includes(selectedMonth));
            let records = targetSheetName ? globalAllSheetsData[targetSheetName] : [];

            let totalDays = 0;
            let htmlDetails = "";

            records.forEach(function(record) {
                let roles = [];
                let radio = record.radioOp ? record.radioOp.toString().trim() : '';
                let clerk = record.clerk ? record.clerk.toString().trim() : '';
                let guard = record.guard ? record.guard.toString().trim() : '';
                let pos501 = record.pos501 ? record.pos501.toString().trim() : '';

                if (radio.includes(targetId)) roles.push("พนักงานวิทยุ");
                if (clerk.includes(targetId)) roles.push("เสมียนเวร");
                if (guard.includes(targetId)) roles.push("รักษาสถานที่");
                if (pos501.includes(targetId)) roles.push("ตำแหน่ง 501");

                if (roles.length > 0) {
                    totalDays++;
                    htmlDetails += `<div class="p-1.5 border-b border-zinc-800 flex justify-between items-center text-xs">
                        <span class="text-zinc-300">📅 วันที่ ${record.day} ${selectedMonth} (ชุดเวร ${record.dutySet})</span>
                        <span class="text-amber-400 font-semibold bg-amber-950/30 px-2 py-0.5 rounded border border-amber-500/20">${roles.join(', ')}</span>
                    </div>`;
                }
            });

            summaryEl.innerText = `รหัส บางบอน ${targetId} ในเดือน [${selectedMonth}] เข้าเวรทั้งหมด: ${totalDays} วัน`;
            listEl.innerHTML = htmlDetails || `<div class="text-zinc-500 p-2 text-center">ไม่พบรายชื่อในเวรเดือน ${selectedMonth}</div>`;
            resultBox.classList.remove('hidden');
        }
    </script>
</body>
</html>
